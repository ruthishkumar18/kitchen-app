name: Kitchen App CI/CD

on:
  push:
    branches: [ main, student/* ]
  pull_request:
    branches: [ main ]

jobs:

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install API dependencies
        run: |
          cd api
          npm install

      - name: Run lint
        run: |
          cd api
          npx eslint server.js

      - name: Run tests
        run: |
          cd api
          npm test

  docker-build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build API Docker image
        run: docker build -t kitchen-api:ci ./api --target production

      - name: Build Web UI Docker image
        run: docker build -t kitchen-web:ci ./web-ui

  k8s-smoke:
    needs: docker-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Kubernetes manifests
        run: |
          kubectl version --client
          kubectl apply --dry-run=client -f k8s/namespace.yaml
          kubectl apply --dry-run=client -f k8s/db/statefulset.yaml
          kubectl apply --dry-run=client -f k8s/api/deployment.yaml
          kubectl apply --dry-run=client -f k8s/web-ui/deployment.yaml